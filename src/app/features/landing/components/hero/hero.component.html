<section id="inicio" class="hero">
  <div class="contenedor hero__interior">
    <div class="hero__texto">
      <span class="hero__etiqueta">{{ etiqueta }}</span>
      <h1>{{ titulo }}</h1>
      <p>{{ descripcion }}</p>

      <div class="hero__acciones">
        <a href="#contacto" class="boton boton-primario">Reservar cita</a>
        <a href="#servicios" class="boton boton-secundario">Ver servicios</a>
      </div>

      <div class="hero__stats">
        @for (dato of estadisticas; track dato.texto) {
          <div class="hero__stat">
            <h3>{{ dato.numero }}</h3>
            <span>{{ dato.texto }}</span>
          </div>
        }
      </div>
    </div>

    <div class="hero__imagen">
      <div class="hero__imagen-marco">
        <img
          src="https://media.istockphoto.com/id/2158631426/es/vector/marco-de-letrero-de-s%C3%ADmbolo-de-peine-de-tijeras-de-secador-de-pelo-para-sal%C3%B3n-de-belleza.jpg?s=612x612&w=0&k=20&c=v_lxFph3TXRRR6aJBXRKfAC_7r2s2K0d2w7zdF-W-Vc="
          alt="Herramientas de peluquería para salón de belleza"
        />
      </div>
    </div>
  </div>
</section>
